<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Zip Library</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="wrap">
<h1>Zip Library <span class="tag">admin</span></h1>
<div class="sub">Control room. <a href="/">Back to site</a></div>
<div class="passbanner">Archive password always <b>thing</b>. Every zip on this site uses it.</div>
<nav id="tabs" style="display:none">
<button data-t="stats" class="on">Metrics</button>
<button data-t="zips">Zips</button>
<button data-t="tg">Telegram</button>
<button data-t="out" style="margin-left:auto">Logout</button>
</nav>
</div></header>
<div class="wrap">
<div id="login" class="card"><h3>Login</h3>
<input id="u" placeholder="username" autocomplete="username"><input id="p" type="password" placeholder="password" autocomplete="current-password">
<button class="btn" onclick="login()">Login</button>
<p class="small" id="loginMsg"></p></div>
<div id="panel" style="display:none"><div id="content"></div></div>
</div>
<script>
let TOK = localStorage.getItem('adm_tok') || '';
let TAB = 'stats';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  if (b.dataset.t === 'out') { TOK = ''; localStorage.removeItem('adm_tok'); location.reload(); return; }
  TAB = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  render();
});
async function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, { 'x-admin-token': TOK });
  const r = await fetch(url, opts);
  if (r.status === 401) { logout('Session expired. Log in again.'); throw new Error('auth'); }
  return r.json();
}
function logout(msg) {
  TOK = ''; localStorage.removeItem('adm_tok');
  document.getElementById('panel').style.display = 'none';
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('login').style.display = '';
  document.getElementById('loginMsg').textContent = msg || '';
}
async function login() {
  document.getElementById('loginMsg').textContent = '';
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) }).then(x => x.json());
  if (r.ok) { TOK = r.token; localStorage.setItem('adm_tok', TOK); enter(); }
  else document.getElementById('loginMsg').textContent = 'Bad login.';
}
function enter() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('panel').style.display = '';
  document.getElementById('tabs').style.display = '';
  render();
}
function render() {
  if (TAB === 'stats') showStats();
  else if (TAB === 'zips') showZips();
  else showSettings();
}
async function showStats() {
  let s;
  try { s = await api('/api/admin/stats'); } catch (e) { return; }
  const rows = (s.visits || []).map(v => {
    const hw = v.hw || {};
    const detail = `UA: ${v.ua || ''} | GPU: ${hw.gpu || '?'} | Screen: ${hw.sw || '?'}x${hw.sh || '?'} | TZ: ${hw.tz || '?'} | Lang: ${hw.lang || '?'} | Cores: ${hw.cores || '?'} | Touch: ${hw.touch || 0} | ISP: ${v.isp || '?'}`;
    return `<tr><td>${esc(v.ip)}</td><td>${esc(v.country)}, ${esc(v.city)}</td><td>${esc(v.origin)}</td><td>${esc(v.browser)} / ${esc(v.os)} / ${esc(v.device)}</td><td title="${esc(detail)}">${esc(v.path)}<div class="small">${esc((hw.gpu || '').slice(0, 40))} ${hw.sw ? esc(hw.sw + 'x' + hw.sh) : ''} ${esc(hw.tz || '')}</div></td></tr>`;
  }).join('');
  const org = Object.entries(s.byOrigin || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
  const geo = Object.entries(s.byGeo || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
  document.getElementById('content').innerHTML = `<div class="card"><h3>Metrics</h3>
  <p>Visits <b>${s.totalVisits}</b> (pc ${s.pcVisits}, mobile ${s.mobileVisits}) | Downloads <b>${s.totalDownloads}</b></p>
  <p>Top origin ${esc(s.topOrigin)} | Top place ${esc(s.topGeo)}</p>
  <h4>Per zip downloads</h4><pre>${esc(JSON.stringify(s.perZip, null, 1))}</pre>
  <h4>Origin breakdown</h4><table>${org}</table>
  <h4>Country and city breakdown</h4><table>${geo}</table>
  <h4>Recent visits (hover path for full hardware detail)</h4>
  <table><tr><th>IP</th><th>Place</th><th>Origin</th><th>Browser</th><th>Path</th></tr>${rows}</table></div>`;
}
async function showZips() {
  let d;
  try { d = await api('/api/admin/zips'); } catch (e) { return; }
  let html = `<div class="card"><h3>New zip</h3><input id="nz_t" placeholder="title"><textarea id="nz_d" placeholder="desc"></textarea>
  <label><input type="checkbox" id="nz_l" style="width:auto"> <b>Locked</b> (needs a referral download to open)</label>
  <textarea id="nz_v" placeholder="videos, one URL per line"></textarea>
  <div style="margin-top:8px"><input type="file" id="nz_f" accept=".zip,.rar,.7z"><div class="small">Pick the zip now and it uploads right after Add. Or leave empty and attach later below.</div></div>
  <button class="btn" onclick="createZip()">Add</button></div>`;
  d.zips.forEach(z => {
    html += `<div class="card"><h3>${esc(z.title)} ${z.locked ? '<span class="tag lock">locked</span>' : '<span class="tag">unlocked</span>'}</h3>
    <div class="small">${esc(z.id)} | ${z.downloads || 0} downloads | ${z.file ? esc(z.file) + ' (' + Math.round(z.size / 1024) + ' KB)' : 'no file yet'}</div>
    <input id="t_${z.id}" value="${esc(z.title)}"><textarea id="d_${z.id}">${esc(z.desc || '')}</textarea>
    <label><input type="checkbox" id="l_${z.id}" ${z.locked ? 'checked' : ''} style="width:auto"> <b>Locked</b> (referral unlock only)</label>
    <textarea id="v_${z.id}" placeholder="videos one per line">${esc((z.videos || []).join('\n'))}</textarea>
    <div><button class="btn" onclick="saveZip('${z.id}')">Save</button> <button class="btn dim" onclick="delZip('${z.id}')">Delete</button></div>
    <div style="margin-top:8px"><input type="file" id="f_${z.id}" accept=".zip,.rar,.7z"><button class="btn" onclick="upZip('${z.id}')">Upload real zip</button></div></div>`;
  });
  document.getElementById('content').innerHTML = html;
}
async function createZip() {
  const videos = document.getElementById('nz_v').value.split('\n').map(s => s.trim()).filter(Boolean);
  let r;
  try { r = await api('/api/admin/zips', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: document.getElementById('nz_t').value, desc: document.getElementById('nz_d').value, locked: document.getElementById('nz_l').checked, videos }) }); }
  catch (e) { return; }
  const f = document.getElementById('nz_f').files[0];
  if (f && r.zip) {
    const fd = new FormData(); fd.append('file', f);
    try { await api('/api/admin/upload/' + r.zip.id, { method: 'POST', body: fd }); } catch (e) { return; }
  }
  showZips();
}
async function saveZip(id) {
  const videos = document.getElementById('v_' + id).value.split('\n').map(s => s.trim()).filter(Boolean);
  try { await api('/api/admin/zips/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: document.getElementById('t_' + id).value, desc: document.getElementById('d_' + id).value, locked: document.getElementById('l_' + id).checked, videos }) }); }
  catch (e) { return; }
  showZips();
}
async function delZip(id) { if (!confirm('delete?')) return; try { await api('/api/admin/zips/' + id, { method: 'DELETE' }); } catch (e) { return; } showZips(); }
async function upZip(id) {
  const f = document.getElementById('f_' + id).files[0]; if (!f) return alert('pick file');
  const fd = new FormData(); fd.append('file', f);
  try { await api('/api/admin/upload/' + id, { method: 'POST', body: fd }); } catch (e) { return; }
  showZips();
}
async function showSettings() {
  let s;
  try { s = await api('/api/admin/stats'); } catch (e) { return; }
  document.getElementById('content').innerHTML = `<div class="card"><h3>Telegram telemetry</h3>
  <div class="small">Only PC visits notify. Mobile stored but silent. Same IP same path within 5 minutes edits the message with REVISIT xN. Bot command /visited works.</div>
  <label>Bot token</label><input id="bot" placeholder="bot token from BotFather" value="">
  <div class="small">${s.settings.hasToken ? 'Token is set (hidden). Only fill to replace it.' : 'No token set yet.'}</div>
  <label>Chat id</label><input id="chat" placeholder="chat id" value="${esc(s.settings.chatId || '')}">
  <div><button class="btn" onclick="saveSet()">Save</button></div>
  <h4>Send test message</h4>
  <textarea id="tmsg" placeholder="message text">Telemetry test OK</textarea>
  <div><button class="btn dim" onclick="testTg()">Send test</button></div>
  <p class="small" id="tgMsg"></p></div>`;
}
async function saveSet() {
  const payload = { chatId: document.getElementById('chat').value };
  if (document.getElementById('bot').value) payload.botToken = document.getElementById('bot').value;
  try { await api('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); }
  catch (e) { return; }
  document.getElementById('tgMsg').textContent = 'Saved.';
}
async function testTg() {
  let r;
  try { r = await api('/api/admin/test-telegram', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: document.getElementById('tmsg').value }) }); }
  catch (e) { return; }
  document.getElementById('tgMsg').textContent = r.ok ? 'Sent.' : 'Failed: ' + JSON.stringify(r.raw).slice(0, 200);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
if (TOK) enter();
</script></body></html>
